[project]
name = "ras-commander-mcp"
version = "0.4.0"
description = "Bounded read-only HEC-RAS text information using public RAS Commander APIs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "CLB Engineering Corporation", email = "info@clbengineering.com"}]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0,<3",
    "ras-commander>=0.103.0,<1",
    "packaging>=24"
]

[project.urls]
Homepage = "https://github.com/gpt-cmdr/ras-commander-mcp"
Documentation = "https://rascommander.info/mcp/"
Repository = "https://github.com/gpt-cmdr/ras-commander-mcp.git"
Company = "https://clbengineering.com/"

[project.scripts]
ras-commander-mcp = "ras_commander_mcp.server:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["ras_commander_mcp"]

[tool.hatch.build.targets.sdist]
include = ["ras_commander_mcp", "pyproject.toml", "README.md", "LICENSE", "docs", "scripts", "tests"]
